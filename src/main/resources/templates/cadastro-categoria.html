<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Categoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8fafc;
            --white: #ffffff;
            --primary-green: #10b981;
            --dark-green: #065f46;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
            --error-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        input.is-invalid {
            border-color: var(--error-red);
        }

        .error-message {
            color: var(--error-red);
            font-size: 0.8rem;
            margin-top: 5px;
            font-weight: 500;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        .btn-save {
            background-color: var(--primary-green);
            color: white;
            border: none;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Categoria</h2>

        <form th:action="@{/categorias/novo}" th:object="${categoria}" method="post">
            <input type="hidden" th:field="*{idCategoria}">

            <div class="form-group">
                <label>Nome da Categoria</label>
                <input type="text" th:field="*{nome}"
                       placeholder="Mínimo 3 caracteres"
                       minlength="3"
                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                       required>

                <div class="error-message" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-save">Salvar Categoria</button>
                <a th:href="@{/categorias}" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
