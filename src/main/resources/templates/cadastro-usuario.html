<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Usuário</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f8fafc;
            --white: #ffffff;
            --primary-green: #10b981;
            --dark-green: #065f46;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
            --error-red: #ef4444;
            --alert-bg: #fef2f2;
            --dialog-overlay: rgba(15, 23, 42, 0.4);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
        }

        .card {
            background: var(--white);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 24px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background-color: var(--white);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-green);
        }

        .alert-error {
            background-color: var(--alert-bg);
            color: var(--error-red);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fee2e2;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }

        .btn-save {
            background-color: var(--primary-green);
            color: white;
            border: none;
        }

        .btn-cancel {
            background-color: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border-color);
        }

        /* --- Estilização do Modal de Confirmação --- */
        dialog {
            border: none;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        dialog::backdrop {
            background-color: var(--dialog-overlay);
            backdrop-filter: blur(4px);
        }

        dialog h3 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--text-main);
        }

        dialog p {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .dialog-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .btn-dialog {
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-confirm {
            background-color: var(--primary-green);
            color: white;
        }

        .btn-close {
            background-color: #f1f5f9;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 th:text="${usuario.idUsuario != null} ? 'Editar Perfil' : 'Criar Conta'">Criar Conta</h2>

        <div class="alert-error" th:if="${erro}" th:text="${erro}"></div>

        <form id="usuarioForm" th:action="@{/cadastro}" th:object="${usuario}" method="post">
            <input type="hidden" id="idUsuario" th:field="*{idUsuario}">

            <div class="form-group">
                <label>Login / Usuário</label>
                <input type="text" th:field="*{login}" placeholder="Digite seu login" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" th:field="*{senha}" placeholder="Digite sua senha" required>
            </div>

            <div class="form-group">
                <label>Tipo de Perfil</label>
                <select th:field="*{perfil}">
                    <option value="ALUNO">Aluno</option>
                    <option value="ADMIN">Administrador</option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-save">Cadastrar</button>
                <a th:href="@{/usuarios}" class="btn btn-cancel">Voltar</a>
            </div>
        </form>
    </div>
</div>

<dialog id="confirmDialog">
    <h3>Alterar Dados do Usuário?</h3>
    <p>Você está editando este usuário. Tem certeza de que quer salvar as novas configurações de acesso?</p>
    <div class="dialog-actions">
        <button id="cancelBtn" class="btn-dialog btn-close">Voltar</button>
        <button id="confirmBtn" class="btn-dialog btn-confirm">Sim, Confirmar</button>
    </div>
</dialog>

<script>
    const form = document.getElementById('usuarioForm');
    const idUsuario = document.getElementById('idUsuario');
    const dialog = document.getElementById('confirmDialog');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    form.addEventListener('submit', function (event) {
        // Abre confirmação se for uma edição de usuário existente
        if (idUsuario && idUsuario.value !== '') {
            event.preventDefault();
            dialog.showModal();
        }
    });

    cancelBtn.addEventListener('click', function () {
        dialog.close();
    });

    confirmBtn.addEventListener('click', function () {
        form.submit();
    });
</script>

</body>
</html>
