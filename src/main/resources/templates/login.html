<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Catálogo Fatec</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --white: #ffffff;
            --primary-green: #10b981;
            --dark-green: #065f46;
            --text-main: #1e293b;
            --text-dim: #64748b;
            --border-color: #e2e8f0;
            --error-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: var(--text-dim);
            text-align: center;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: var(--dark-green);
        }

        .alert-error {
            background-color: #fee2e2;
            color: var(--error-red);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #fecaca;
        }

        .footer-text {
            margin-top: 25px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Bem-vindo</h2>
    <p class="subtitle">Acesse o Catálogo de Produtos</p>

    <div th:if="${param.error}" class="alert-error">
        Usuário ou senha inválidos.
    </div>

    <div th:if="${param.logout}" style="color: var(--primary-green); text-align: center; margin-bottom: 15px; font-size: 0.9rem;">
        Você saiu com sucesso.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Login</label>
            <input type="text" id="username" name="username" placeholder="Digite seu usuário" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar no Sistema</button>
    </form>

    <div class="footer-text">
        Sistema de Gerenciamento Fatec
    </div>
</div>

</body>
</html>
